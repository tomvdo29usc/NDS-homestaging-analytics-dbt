models:
  - name: dbt_revenue_analysis
    description: "Track revenue of each staging order"
    columns:
      - name: Order_ID
        description: "Order ID"
        tests:
          - not_null
          - unique

      - name: Status
        description: "Order status (Inquiry, Staging Scheduling, Archived, etc.)"

      - name: Client_Name
        description: "Client name for the order"

      - name: Property_Address
        description: "Property address for the order"

      - name: Payment_Amount
        description: "Payment amount recorded for the order"

      - name: Schedule_Staging_Date
        description: "Scheduled staging date (if any)"

      - name: date_revenue
        description: "Staging date when the revenue is officially earned"

      - name: Earning_Amount
        description: "Revenue Amount (Paid and Staged)"

      - name: OutstandingQuote_Amount
        description: "Quote Amount for staging order that is not converted yet"

      - name: PendingEarning_Amount
        description: "Revenue Amount when order is paid or converted but not yet staged"

      - name: Lost_Revenue
        description: "Quote Amount when client didn't move forward with staging (archived inquiry)"
